<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOSA Admin</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 p-4"><div class="max-w-4xl mx-auto bg-white rounded-2xl p-5"><h1 class="font-black text-2xl">SOSA Admin - Edit Yourself</h1><p class="text-sm text-gray-500">Edit photo URLs, save locally, export for GitHub</p><div id="list" class="mt-5 space-y-4"></div><div class="mt-6 flex gap-2 flex-wrap"><button onclick="saveLocal()" class="bg-black text-white px-5 py-3 rounded-full font-bold">Save Locally</button><button onclick="exportCode()" class="bg-yellow-400 text-black px-5 py-3 rounded-full font-bold">Export Code</button><button onclick="location.href='index.html'" class="bg-gray-200 px-5 py-3 rounded-full">View Store</button></div><div id="exportBox" class="hidden mt-6"><textarea id="exportArea" class="w-full h-64 p-3 text-[10px] bg-black text-green-400 rounded-xl"></textarea></div></div><script>let products=JSON.parse(localStorage.getItem('sosa_custom_products')||'null')||JSON.parse(localStorage.getItem('sosa_custom_products')||'[]').length?JSON.parse(localStorage.getItem('sosa_custom_products')):[{id:1,name:"Custom Leather Sneakers",cat:"Men Shoes",price:0.05,stock:"Trending",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",variants:{Black:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",White:"https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=400",Brown:"https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=400"}}];function render(){const list=document.getElementById('list');list.innerHTML='';let stored=JSON.parse(localStorage.getItem('sosa_custom_products')||'null');if(stored)products=stored;else{products=JSON.parse(localStorage.getItem('sosa_custom_products')||'null')||products}if(products.length===0){products=[{id:1,name:"Custom Leather Sneakers",cat:"Men Shoes",price:0.05,stock:"Trending",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",variants:{Black:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"}}]}products.forEach((p,i)=>{list.innerHTML+=`<div class="border p-4 rounded-xl"><div class="flex gap-3"><img src="${p.img}" class="w-20 h-20 object-cover rounded-xl"><div><b>#${p.id} ${p.name}</b></div></div><div class="grid grid-cols-1 gap-2 mt-3"><input oninput="products[${i}].name=this.value" value="${p.name}" placeholder="Name" class="p-2 rounded text-sm border"><input oninput="products[${i}].img=this.value" value="${p.img}" placeholder="Main Image URL" class="p-2 rounded text-sm border"><textarea oninput="parseVar(${i},this.value)" class="w-full p-2 rounded text-xs h-20 border">${Object.entries(p.variants||{}).map(([k,v])=>k+'::'+v).join('\n')}</textarea></div></div>`});}function parseVar(i,t){let o={};t.split('\n').forEach(l=>{let s=l.split('::');if(s.length>=2)o[s[0].trim()]=s.slice(1).join('::').trim()});products[i].variants=o}function saveLocal(){localStorage.setItem('sosa_custom_products',JSON.stringify(products));alert('Saved!')}function exportCode(){document.getElementById('exportBox').classList.remove('hidden');document.getElementById('exportArea').value=JSON.stringify(products,null,2)}render();</script></body></html>
