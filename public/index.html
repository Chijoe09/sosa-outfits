<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOSA Outfits | sosa.pi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>Pi.init({ version: "2.0", sandbox: true });</script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif}</style>
</head>
<body class="bg-black text-white">
<header class="p-4 flex justify-between items-center">
<div class="font-black text-xl">SOSA<span class="text-yellow-400">.pi</span></div>
<div id="cartBtn" class="bg-zinc-900 px-4 py-2 rounded-full">🛒 <span id="cartCount">0</span></div>
</header>

<section class="p-2 text-center">
<h1 class="text-zinc-400 max-w-xl mx-auto">HEAD-TO-TOE LUXURY</h1>
<div class="flex flex-wrap gap-2 justify-center mt-3">
<button onclick="filterCat('all')" class="bg-white text-black px-3 py-1 rounded-full">All</button>
<button onclick="filterCat('Shoes')" class="bg-zinc-800 px-3 py-1 rounded-full">Shoes</button>
<button onclick="filterCat('Bags')" class="bg-zinc-800 px-3 py-1 rounded-full">Bags</button>
<button onclick="filterCat('Jeans')" class="bg-zinc-800 px-3 py-1 rounded-full">Jeans</button>
<button onclick="filterCat('Shirts')" class="bg-zinc-800 px-3 py-1 rounded-full">Shirts</button>
<button onclick="filterCat('Belts')" class="bg-zinc-800 px-3 py-1 rounded-full">Belts</button>
<button onclick="filterCat('Face Cap')" class="bg-zinc-800 px-3 py-1 rounded-full">Face Cap</button>
</div>
</section>

<section id="products" class="grid grid-cols-2 md:grid-cols-4 gap-3 p-3"></section>

<!-- CART MODAL -->
<div id="cartModal" class="fixed inset-0 bg-black/80 hidden">
<div class="bg-zinc-900 max-w-md mx-auto mt-10 p-4 rounded-xl">
<div class="flex justify-between"><h2 class="font-bold">Your Cart</h2><button onclick="closeCart()">X</button></div>
<div id="cartItems" class="mt-3"></div>
<div id="totalPi" class="mt-3 font-bold text-yellow-400"></div>
<button onclick="checkoutPi()" class="w-full bg-yellow-400 text-black font-black py-3 mt-3 rounded-full">Pay with Pi</button>
</div>
</div>

<script>
 const productData = [{id:1,name:"Custom Leather Sneakers",cat:"Shoes",price:0.05,stock:"Trending",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"},{id:2,name:"Designer Tote Bag",cat:"Bags",price:0.05,stock:"In Stock",img:"https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=400"},{id:3,name:"Luxury Street Shirt",cat:"Shirts",price:0.05,stock:"New Arrival",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"},{id:4,name:"Gold Buckle Belt",cat:"Belts",price:0.05,stock:"Trending",img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400"},{id:5,name:"Suede Face Cap",cat:"Face Cap",price:0.05,stock:"New Arrival",img:"https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=400"},{id:6,name:"Slim Fit Denim",cat:"Jeans",price:0.05,stock:"In Stock",img:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=400"},{id:7,name:"Full Street Fit",cat:"Complete",price:0.15,stock:"Trending",img:"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=400"},{id:8,name:"Suede Chelsea Boots",cat:"Shoes",price:0.08,stock:"New Arrival",img:"https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=400"}];
let products = [...productData];

let currentCat='all', currentStock='all';
let cart=[];

function renderProducts(){
 const grid=document.getElementById('products');
 grid.innerHTML='';
 productData.filter(p=>{
   const catMatch=currentCat==='all'||p.cat===currentCat;
   return catMatch;
 }).forEach(p=>{
  grid.innerHTML+='<div class="bg-zinc-900 rounded-xl p-3"><div class="h-32 bg-zinc-800 rounded-lg overflow-hidden mb-2"><img src="'+p.img+'" class="w-full h-full object-cover"></div><div class="text-white font-bold text-sm">'+p.name+'</div><div class="text-xs text-zinc-400 mb-1">'+p.cat+'</div><div class="text-yellow-400 font-black">'+p.price+' Pi</div><button onclick="addToCart('+p.id+')" class="w-full mt-2 bg-white text-black rounded-full py-1.5 text-sm font-bold">Add</button></div>';
 });
}
renderProducts();

function filterCat(c){currentCat=c; renderProducts();}
function filterStock(s){currentStock=s; renderProducts();}

// === PART 1: CART BRAIN - SAFE TO REPLACE ===
let cart = [];
function addToCart(id) {
  const item = productData.find(p=>p.id==id);
  if(item) {
    cart.push(item);
    updateCartUI();
  }
}
}

function updateCartUI() {
  const total = cart.reduce((sum, item) => sum + item.price, 0);
  const totalEl = document.getElementById('cart-total');
  const countEl = document.getElementById('cart-count');
  const listEl = document.getElementById('cart-items');

  if(totalEl) totalEl.innerText = `Total: ${total.toFixed(3)} Pi`;
  if(countEl) countEl.innerText = cart.length;
  if(listEl) {
    listEl.innerHTML = cart.map((c,i) => 
      `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee">
         <span>${c.name}</span><span>${c.price} Pi</span>
       </div>`
    ).join('');
  }
}

function getCartTotal() {
  return cart.reduce((sum, item) => sum + item.price, 0);
}

// This is your new Pay button logic - it CALLS your old checkoutPi
async function payNow() {
  const total = getCartTotal();
  if(total === 0) {
    alert("Cart is empty - add items first");
    return;
  }
  // Call your existing payment function you already fixed
  // It will now receive correct amount
  checkoutPi(total, cart);
}
function closeCart(){document.getElementById('cartModal').classList.add('hidden');}
document.getElementById('cartBtn').onclick=()=>{updateCart();}

function onIncompletePaymentFound(payment){
 console.log("Incomplete payment found:", payment);
 return fetch('/api/complete', {
   method:'POST',
   body: JSON.stringify({paymentId: payment.identifier})
 });
}

async function checkoutPi(){
 if(cart.length===0){alert("Cart empty"); return;}
 const total=cart.reduce((a,b)=>a+b.price,0);
 try{
   const auth = await Pi.authenticate(['username','payments'], onIncompletePaymentFound);
   console.log("Auth success:", auth);

   const paymentData = { 
  amount: total, 
  memo: "SOSA Outfits - "+cart.length+" items", 
  metadata: {cart: cart} 
};
const callbacks = {
  onReadyForServerApproval: async function(paymentId){
    await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId})});
  },
  onReadyForServerCompletion: async function(paymentId, txid){
    await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId, txid})});
    alert("Payment Success!");
    cart=[]; updateCart(); closeCart();
  },
  onCancel: function(paymentId){ alert("Cancelled"); },
  onError: function(error){ console.error(error); }
};
await Pi.createPayment(paymentData, callbacks);
 } catch(err){
   alert("Auth/Payment error: "+err);
   console.error(err);
 }
}
</script>
</body>
</html>
