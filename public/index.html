<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOSA Outfits | sosa.pi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>Pi.init({ version: "2.0", sandbox: false });</script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif} .toast{animation:slide 3s forwards} @keyframes slide{0%{transform:translateY(20px);opacity:0}10%{transform:translateY(0);opacity:1}90%{opacity:1}100%{transform:translateY(-20px);opacity:0}}</style>
</head>
<body class="bg-black text-white pb-20">
<header class="p-4 flex justify-between items-center sticky top-0 bg-black z-20 border-b border-zinc-900">
<div class="font-black text-xl">SOSA<span class="text-yellow-400">.pi</span></div>
<div class="flex gap-2"><a href="admin.html" class="bg-zinc-800 px-3 py-2 rounded-full text-xs">Admin</a><div id="cartBtn" class="bg-zinc-900 px-4 py-2 rounded-full cursor-pointer">🛒 <span id="cartCount">0</span></div></div>
</header>
<section class="p-3">
<div class="flex gap-2"><input id="searchInput" oninput="searchProducts()" placeholder="Search outfits..." class="flex-1 bg-zinc-900 border border-zinc-800 px-4 py-2 rounded-full text-sm outline-none"><button onclick="clearSearch()" class="bg-zinc-800 px-4 rounded-full text-xs">Clear</button></div>
<div class="flex flex-wrap gap-2 justify-center mt-3">
<button onclick="filterCat('all')" id="cat-all" class="catBtn bg-white text-black px-3 py-1 rounded-full text-sm">All</button>
<button onclick="filterCat('Shoes')" id="cat-Shoes" class="catBtn bg-zinc-800 px-3 py-1 rounded-full text-sm">Shoes</button>
<button onclick="filterCat('Bags')" id="cat-Bags" class="catBtn bg-zinc-800 px-3 py-1 rounded-full text-sm">Bags</button>
<button onclick="filterCat('Jeans')" id="cat-Jeans" class="catBtn bg-zinc-800 px-3 py-1 rounded-full text-sm">Jeans</button>
<button onclick="filterCat('Shirts')" id="cat-Shirts" class="catBtn bg-zinc-800 px-3 py-1 rounded-full text-sm">Shirts</button>
<button onclick="filterCat('Belts')" id="cat-Belts" class="catBtn bg-zinc-800 px-3 py-1 rounded-full text-sm">Belts</button>
<button onclick="filterCat('Face Cap')" id="cat-Face Cap" class="catBtn bg-zinc-800 px-3 py-1 rounded-full text-sm">Face Cap</button>
</div>
</section>
<section id="products" class="grid grid-cols-2 md:grid-cols-4 gap-3 p-3"></section>
<footer class="text-center text-zinc-400 text-xs mt-10 p-6 border-t border-zinc-900">
<p class="font-bold text-white mb-2">Follow SOSA</p>
<div class="flex justify-center gap-4 mb-3"><a href="https://instagram.com" target="_blank" class="underline">Instagram</a><a href="https://x.com" target="_blank" class="underline">X</a><a href="https://tiktok.com" target="_blank" class="underline">TikTok</a></div>
<div class="flex justify-center gap-3"><a href="https://wa.me/234817657579" target="_blank" class="bg-green-500 text-black px-4 py-2 rounded-full font-bold">WhatsApp Us</a><button onclick="shareSite()" class="bg-zinc-800 px-4 py-2 rounded-full">Share Shop</button></div>
<p class="mt-4 text-[10px]">sosa.pi • Pi payments in 7 decimals</p>
</footer>
<div id="toastBox" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[100]"></div>

<div id="productModal" class="fixed inset-0 bg-black/80 hidden z-[60]"><div class="bg-zinc-900 max-w-md mx-auto mt-10 p-4 rounded-xl"><div class="flex justify-between"><h2 id="modalName" class="font-bold"></h2><button onclick="closeProductModal()">X</button></div><img id="modalImg" class="w-full h-60 object-cover rounded mt-3"><div class="mt-3"><p class="text-sm">Size:</p><div id="sizeBox" class="flex flex-wrap gap-2 mt-1"></div><p class="text-sm mt-3">Color:</p><div class="flex gap-2 mt-1"><button onclick="setColor('Black')" id="color-Black" class="colorBtn bg-white text-black px-3 py-1 rounded">Black</button><button onclick="setColor('White')" id="color-White" class="colorBtn bg-zinc-800 px-3 py-1 rounded">White</button><button onclick="setColor('Brown')" id="color-Brown" class="colorBtn bg-zinc-800 px-3 py-1 rounded">Brown</button></div><button onclick="confirmAddToCart()" class="w-full bg-yellow-400 text-black font-black py-3 mt-4 rounded-full">Add to Cart - <span id="modalPrice"></span> Pi</button></div></div></div>

<div id="cartModal" class="fixed inset-0 bg-black/80 hidden z-50 overflow-auto"><div class="bg-zinc-900 max-w-md mx-auto mt-10 p-4 rounded-xl"><div class="flex justify-between items-center"><h2 class="font-bold">Your Cart</h2><div class="flex gap-3"><button onclick="clearCart()" class="text-xs text-red-400">Clear All</button><button onclick="closeCart()">X</button></div></div><div id="cartItems" class="mt-3"></div><div class="mt-3 text-xs text-zinc-500">Delivery: <span id="deliveryFee">0.0100000 Pi</span></div><div id="totalPi" class="mt-1 font-bold text-yellow-400"></div><button onclick="openCheckoutForm()" class="w-full bg-yellow-400 text-black font-black py-3 mt-3 rounded-full">Proceed to Checkout</button></div></div>

<div id="checkoutModal" class="fixed inset-0 bg-black/90 hidden z-[70] overflow-auto"><div class="bg-zinc-900 max-w-md mx-auto mt-10 p-4 rounded-xl"><div class="flex justify-between"><h2 class="font-bold">Delivery Details</h2><button onclick="closeCheckoutForm()">X</button></div><input id="custName" placeholder="Full Name" class="w-full bg-zinc-800 px-3 py-2 rounded mt-3 text-sm"><input id="custPhone" placeholder="Phone / WhatsApp" class="w-full bg-zinc-800 px-3 py-2 rounded mt-2 text-sm"><textarea id="custAddress" placeholder="Delivery Address" class="w-full bg-zinc-800 px-3 py-2 rounded mt-2 text-sm"></textarea><div id="checkoutSummary" class="mt-3 text-xs text-zinc-400"></div><button id="payBtn" onclick="checkoutPi()" class="w-full bg-yellow-400 text-black font-black py-3 mt-4 rounded-full">Pay with Pi</button><p id="payStatus" class="text-xs text-center mt-2 text-zinc-400"></p></div></div>

<script>
const productData = [{id:1,name:"Custom Leather Sneakers",cat:"Shoes",price:0.05,stock:"Trending",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",isShoe:true},{id:2,name:"Designer Tote Bag",cat:"Bags",price:0.05,stock:"In Stock",img:"https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=400",isShoe:false},{id:3,name:"Luxury Street Shirt",cat:"Shirts",price:0.05,stock:"New Arrival",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",isShoe:false},{id:4,name:"Gold Buckle Belt",cat:"Belts",price:0.05,stock:"Trending",img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400",isShoe:false},{id:5,name:"Suede Face Cap",cat:"Face Cap",price:0.05,stock:"New Arrival",img:"https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=400",isShoe:false},{id:6,name:"Slim Fit Denim",cat:"Jeans",price:0.05,stock:"In Stock",img:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=400",isShoe:false},{id:7,name:"Full Street Fit",cat:"Complete",price:0.15,stock:"Trending",img:"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=400",isShoe:false},{id:8,name:"Suede Chelsea Boots",cat:"Shoes",price:0.08,stock:"New Arrival",img:"https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=400",isShoe:true}];
let currentCat='all'; let searchQ=''; const DELIVERY_FEE=0.01;
let cart=JSON.parse(localStorage.getItem('sosa_cart')||'[]'); let orders=JSON.parse(localStorage.getItem('sosa_orders')||'[]');
let selectedProduct=null; let selectedSize='M'; let selectedColor='Black';
function fmt(p){ return parseFloat(p).toFixed(7); }
function showToast(msg){ const box=document.getElementById('toastBox'); const div=document.createElement('div'); div.className='toast bg-yellow-400 text-black px-4 py-2 rounded-full text-sm font-bold'; div.innerText=msg; box.appendChild(div); setTimeout(()=>div.remove(),3000); }
function renderProducts(){ const grid=document.getElementById('products'); grid.innerHTML=''; let filtered=productData.filter(p=>{ const catMatch=currentCat==='all'||p.cat===currentCat; const searchMatch=p.name.toLowerCase().includes(searchQ.toLowerCase()); return catMatch&&searchMatch; }); filtered.forEach(p=>{ grid.innerHTML+=`<div class="bg-zinc-900 p-3 rounded"><img onclick="openProductModal(${p.id})" src="${p.img}" class="w-full h-40 object-cover rounded"><h3 class="text-sm mt-2">${p.name}</h3><p class="text-yellow-400 text-xs">${fmt(p.price)} Pi • ${p.stock}</p><button onclick="openProductModal(${p.id})" class="mt-2 w-full bg-yellow-400 text-black py-1 rounded text-xs">Select Options</button></div>`; }); }
function filterCat(c){ currentCat=c; if(c==='all'){ searchQ=''; document.getElementById('searchInput').value=''; } document.querySelectorAll('.catBtn').forEach(b=>{b.className='catBtn bg-zinc-800 px-3 py-1 rounded-full text-sm'}); document.getElementById('cat-'+c).className='catBtn bg-white text-black px-3 py-1 rounded-full text-sm'; renderProducts(); }
function searchProducts(){ searchQ=document.getElementById('searchInput').value; renderProducts(); }
function clearSearch(){ searchQ=''; document.getElementById('searchInput').value=''; currentCat='all'; filterCat('all'); }
function saveCart(){localStorage.setItem('sosa_cart', JSON.stringify(cart));} function saveOrders(){localStorage.setItem('sosa_orders', JSON.stringify(orders));}
renderProducts(); updateCartUI();
function getSizes(p){ return p.isShoe ? ['40','41','42','43','44','45'] : ['S','M','L','XL']; }
function openProductModal(id){ selectedProduct=productData.find(p=>p.id===id); const sizes=getSizes(selectedProduct); selectedSize=sizes[1]||sizes[0]; selectedColor='Black'; document.getElementById('modalName').innerText=selectedProduct.name; document.getElementById('modalImg').src=selectedProduct.img; document.getElementById('modalPrice').innerText=fmt(selectedProduct.price); document.getElementById('sizeBox').innerHTML=sizes.map(s=>`<button onclick="setSize('${s}')" id="size-${s}" class="sizeBtn bg-zinc-800 px-3 py-1 rounded">${s}</button>`).join(''); document.getElementById('productModal').classList.remove('hidden'); setSize(selectedSize); setColor('Black'); }
function closeProductModal(){document.getElementById('productModal').classList.add('hidden');}
function setSize(s){ selectedSize=s; document.querySelectorAll('.sizeBtn').forEach(b=>{b.className='sizeBtn bg-zinc-800 px-3 py-1 rounded'}); document.getElementById('size-'+s).className='sizeBtn bg-white text-black px-3 py-1 rounded'; }
function setColor(c){ selectedColor=c; document.querySelectorAll('.colorBtn').forEach(b=>{b.className='colorBtn bg-zinc-800 px-3 py-1 rounded'}); document.getElementById('color-'+c).className='colorBtn bg-white text-black px-3 py-1 rounded'; }
function confirmAddToCart(){ const uniqueKey=`${selectedProduct.id}-${selectedSize}-${selectedColor}`; const ex=cart.find(c=>c.uniqueKey===uniqueKey); if(ex){ ex.qty+=1; } else { cart.push({...selectedProduct,size:selectedSize,color:selectedColor,uniqueKey,qty:1}); } saveCart(); updateCartUI(); closeProductModal(); showToast(`Added ${selectedSize}/${selectedColor}`); }
function removeItem(k){ cart=cart.filter(c=>c.uniqueKey!==k); saveCart(); updateCartUI(); }
function updateQty(k,n){ if(n<=0){ removeItem(k); return; } cart.find(c=>c.uniqueKey===k).qty=n; saveCart(); updateCartUI(); }
function clearCart(){ if(confirm("Clear cart?")){ cart=[]; saveCart(); updateCartUI(); } }
function updateCartUI(){ const subtotal=cart.reduce((s,i)=>s+(i.price*i.qty),0); const total=subtotal+(cart.length?DELIVERY_FEE:0); const count=cart.reduce((s,i)=>s+i.qty,0); document.getElementById('cartCount').innerText=count; document.getElementById('cartItems').innerHTML=cart.length?cart.map(c=>`<div style="display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #333"><img src="${c.img}" style="width:40px;height:40px;object-fit:cover;border-radius:6px"/><div style="flex:1"><div style="font-size:13px">${c.name}</div><div style="font-size:11px;color:#999">${c.size} / ${c.color}</div><div style="display:flex;gap:6px;align-items:center;margin-top:4px"><button onclick="updateQty('${c.uniqueKey}', ${c.qty-1})" style="border:1px solid #444;width:22px;height:22px;border-radius:4px">-</button><span style="font-size:12px;width:16px;text-align:center">${c.qty}</span><button onclick="updateQty('${c.uniqueKey}', ${c.qty+1})" style="border:1px solid #444;width:22px;height:22px;border-radius:4px">+</button></div></div><div style="text-align:right"><div style="font-size:13px;color:#facc15">${fmt(c.price*c.qty)} Pi</div><button onclick="removeItem('${c.uniqueKey}')" style="font-size:12px;color:#ff5555;margin-top:4px">X Remove</button></div></div>`).join(''):`<p class="text-zinc-500 text-sm py-4">Cart empty</p>`; document.getElementById('totalPi').innerText=cart.length?`Subtotal ${fmt(subtotal)} Pi + Delivery ${fmt(DELIVERY_FEE)} Pi = Total ${fmt(total)} Pi (${count} items)`:'Total: 0.0000000 Pi'; }
function updateCart(){ updateCartUI(); document.getElementById('cartModal').classList.remove('hidden'); }
function getCartTotal(){ const sub=cart.reduce((s,i)=>s+(i.price*i.qty),0); return sub+(cart.length?DELIVERY_FEE:0); }
function closeCart(){document.getElementById('cartModal').classList.add('hidden');}
function openCheckoutForm(){ if(!cart.length){alert("Cart empty"); return;} document.getElementById('checkoutSummary').innerText=`${cart.length} items, Total ${fmt(getCartTotal())} Pi incl. delivery`; document.getElementById('cartModal').classList.add('hidden'); document.getElementById('checkoutModal').classList.remove('hidden'); }
function closeCheckoutForm(){document.getElementById('checkoutModal').classList.add('hidden');}
function shareSite(){ const url=location.href; if(navigator.share){ navigator.share({title:'SOSA Outfits', text:'Buy luxury with Pi - sosa.pi', url}).catch(()=>{navigator.clipboard.writeText(url); showToast("Link copied!");}); } else { navigator.clipboard.writeText(url); showToast("Link copied!"); } }
document.getElementById('cartBtn').onclick=()=>{updateCart();}
function onIncompletePaymentFound(p){ return fetch('/api/complete', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:p.identifier})}); }
async function checkoutPi(){
 const name=document.getElementById('custName').value.trim(); const phone=document.getElementById('custPhone').value.trim(); const addr=document.getElementById('custAddress').value.trim();
 if(!name||!phone||!addr){alert("Fill all"); return;} const payBtn=document.getElementById('payBtn'); payBtn.disabled=true; payBtn.innerText='Processing...';
 const total=parseFloat(getCartTotal().toFixed(7));
 try{
  await Pi.authenticate(['username','payments'], onIncompletePaymentFound);
  const paymentData={amount:total,memo:`SOSA - ${name}`,metadata:{cart, customer:{name,phone,addr}}};
  const callbacks={
   onReadyForServerApproval: async function(pid){ await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid})}); },
   onReadyForServerCompletion: async function(pid,txid){ await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid,txid})}); orders=JSON.parse(localStorage.getItem('sosa_orders')||'[]'); orders.unshift({date:new Date().toLocaleDateString(), time:Date.now(), total, subtotal:total-DELIVERY_FEE, delivery:DELIVERY_FEE, customer:{name,phone,addr}, items:[...cart], txid, paymentId:pid, status:'Paid', tracking:'', paid:true}); localStorage.setItem('sosa_orders', JSON.stringify(orders)); alert("Payment Success! "+fmt(total)+" Pi"); cart=[]; saveCart(); updateCartUI(); closeCheckoutForm(); payBtn.disabled=false; payBtn.innerText='Pay with Pi'; showToast("Order placed!"); },
   onCancel:function(){ payBtn.disabled=false; payBtn.innerText='Pay with Pi'; alert("Cancelled"); },
   onError:function(e){ payBtn.disabled=false; payBtn.innerText='Pay with Pi'; alert("Error "+e); }
  }; await Pi.createPayment(paymentData, callbacks);
 } catch(err){ payBtn.disabled=false; payBtn.innerText='Pay with Pi'; alert(err); }
}
</script>
</body>
</html>
