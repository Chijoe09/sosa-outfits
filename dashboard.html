<!DOCTYPE html>
<html><head><title>SOSA Sales Dashboard</title></head>
<body style="font-family:sans-serif;padding:20px">
<h2>SOSA Outfits - Sales Log</h2>
<p>Wallet: GBNIM...TKMZT</p>
<h3 id="total-received">Total Received: Loading...</h3>
<div id="tx-list"></div>

<script>
async function loadDashboard() {
  // pulls from your Vercel logs /api/payments (you need to create this)
  const res = await fetch('/api/payments');
  const data = await res.json();
  
  let total = 0;
  let html = "";
  data.forEach(tx => {
    total += tx.amount;
    html += `<div style="border:1px solid #ddd;padding:10px;margin:8px 0">
      <b>${tx.amount} Pi</b> - ${tx.memo} <br>
      <small>From: ${tx.from} | ${new Date(tx.created_at).toLocaleString()}</small><br>
      <small>TxID: ${tx.identifier}</small>
    </div>`;
  });
  
  document.getElementById('total-received').innerText = `Total Received: ${total.toFixed(3)} Pi (${data.length} sales)`;
  document.getElementById('tx-list').innerHTML = html || "No sales yet";
}
loadDashboard();
</script>
</body></html>
